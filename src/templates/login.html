<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — AyurGenX</title>
    <style>
      :root {
        --primary: #0071e3;
        --bg: #f5f5f7;
        --text: #1d1d1f;
        --white: #ffffff;
        --border: #d2d2d7;
        --gray: #86868b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .auth-container {
        background: var(--white);
        padding: 40px;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }
      h2 {
        font-size: 24px;
        margin-bottom: 8px;
        text-align: center;
      }
      p.sub {
        font-size: 14px;
        color: var(--gray);
        text-align: center;
        margin-bottom: 30px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--text);
      }
      input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus {
        border-color: var(--primary);
      }
      .btn-submit {
        width: 100%;
        background: var(--primary);
        color: var(--white);
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      .footer-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: var(--gray);
      }
      .footer-link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <h2>Welcome Back</h2>
      <p class="sub">Sign in to access your AyurGenX dashboard</p>

      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="footer-link">Don't have an account? <a href="#/register">Register</a></div>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        // Simulate successful login routing to dashboard
        window.location.href = 'dashboard.html';
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          const response = await fetch('http://localhost:5000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();
          if (response.ok) {
            localStorage.setItem('ayurgenx_token', data.token);
            localStorage.setItem('ayurgenx_user', JSON.stringify(data.user));
            window.location.href = 'dashboard.html';
          } else {
            alert(data.error || 'Login failed');
          }
        } catch (err) {
          console.error('Network error:', err);
          alert('Could not connect to server.');
        }
      });
    </script>
  </body>
</html>
