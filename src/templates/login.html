<div class="auth-page-wrapper">
  <div class="auth-card">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-sub">Sign in to access your AyurGenX dashboard</p>

    <!-- Alert / Feedback Area -->
    <div id="auth-alert" class="auth-alert" style="display: none"></div>

    <form id="login-form" autocomplete="off" novalidate>
      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" required placeholder="name@example.com" autocomplete="email" />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
          <!-- Password See / No See Toggle Button -->
          <button
            type="button"
            id="toggle-password"
            class="password-toggle-btn"
            aria-label="Toggle password visibility"
            title="Show / Hide Password"
          >
            <span class="material-icons" id="toggle-password-icon">visibility_off</span>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="btn-login-submit">Sign In</button>
    </form>

    <!-- Footer Links -->
    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a href="#/register" class="register-link">Register</a>
    </div>
  </div>
</div>
